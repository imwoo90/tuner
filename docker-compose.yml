services:
  tuner-sandbox:
    image: tuner-tuner-sandbox
    container_name: tuner-sandbox
    restart: unless-stopped
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=${HOME:-/root}
      - USER=${USER:-root}
      - TERM=xterm-256color
      - RUST_LOG=info
      - PATH=${HOME:-/root}/.local/bin:${HOME:-/root}/.gemini/antigravity-cli/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # 1. Source code workspace (relative to repo root)
      - .:/workspace
      # 2. Container Tuner persistent home directory
      - ${HOME:-/root}/.tuner-dev:${HOME:-/root}/.tuner
      # 3. Antigravity state, tokens & CLI binary directory (matching host user HOME)
      - ${HOME:-/root}/.gemini:${HOME:-/root}/.gemini
      # 4. Host local bin directory
      - ${HOME:-/root}/.local/bin:${HOME:-/root}/.local/bin:ro
