services:
  tuner-sandbox:
    image: tuner-tuner-sandbox
    container_name: tuner-sandbox
    restart: unless-stopped
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      - HOME=/root
      - TERM=xterm-256color
      - RUST_LOG=info
      - PATH=/root/.local/bin:/root/.gemini/antigravity-cli/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # 1. Source code workspace (real-time dev sync)
      - /home/wimvm/.tuner/profiles/default/workspace/projects/tuner:/workspace
      # 2. Antigravity state, tokens & CLI binary directory (directory bind mount for atomic in-place updates)
      - /home/wimvm/.gemini/antigravity-cli:/root/.gemini/antigravity-cli
      # 3. Host local bin directory (directory bind mount instead of single-file inode mount)
      - /home/wimvm/.local/bin:/root/.local/bin:ro
