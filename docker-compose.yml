services:
  tuner-sandbox:
    image: tuner-tuner-sandbox
    container_name: tuner-sandbox
    restart: unless-stopped
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    user: "1000:1000"
    environment:
      - HOME=/home/wimvm
      - USER=wimvm
      - TERM=xterm-256color
      - RUST_LOG=info
      - PATH=/home/wimvm/.local/bin:/home/wimvm/.gemini/antigravity-cli/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # 1. Source code workspace (real-time dev sync)
      - /home/wimvm/.tuner/profiles/default/workspace/projects/tuner:/workspace
      # 2. Container Tuner persistent home directory
      - /home/wimvm/.tuner-dev:/home/wimvm/.tuner
      # 3. Antigravity state, tokens & CLI binary directory (matching host paths for UID 1000)
      - /home/wimvm/.gemini:/home/wimvm/.gemini
      # 4. Host local bin directory
      - /home/wimvm/.local/bin:/home/wimvm/.local/bin:ro
