<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>Tuner Remote Browser Auth</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .toolbar { background: #1e293b; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px solid #334155; z-index: 10; }
  button { border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: #f8fafc; background: #334155; touch-action: manipulation; }
  button:active { opacity: 0.75; transform: translateY(1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-vault { background: #2563eb; }
  .btn-tab { background: #7c3aed; display: none; }
  .btn-done { background: #059669; margin-left: auto; padding: 7px 12px; }
  .meta { width: 100%; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #94a3b8; padding-top: 2px; }
  .status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .ttl { font-variant-numeric: tabular-nums; color: #cbd5e1; flex-shrink: 0; }
  .stage { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow: auto; background: #020617; position: relative; }
  canvas { width: 100%; max-width: 760px; height: auto; display: block; background: #fff; touch-action: none; box-shadow: 0 8px 28px rgba(0,0,0,0.45); }
  .scroll-pad { position: fixed; right: 10px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; }
  .scroll-pad button { width: 44px; height: 44px; border-radius: 22px; background: rgba(30,41,59,0.9); border: 1px solid #64748b; font-size: 18px; padding: 0; }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="btnUser" class="btn-vault" onclick="sendAct({type:'vault_user'})">🔑 ID 입력</button>
    <button id="btnPass" class="btn-vault" onclick="sendAct({type:'vault_pass'})">🔒 PW 입력</button>
    <button id="btnType" onclick="promptText()">⌨️ 직접입력</button>
    <button id="btnCopy" onclick="sendAct({type:'copy_out'})">📋 복사</button>
    <button onclick="sendAct({type:'key', key:'Enter'})">↵ Enter</button>
    <button onclick="sendAct({type:'key', key:'Backspace'})">⌫</button>
    <button onclick="sendAct({type:'key', key:'Tab'})">⇥ Tab</button>
    <button id="btnBack" onclick="sendAct({type:'back'})">◀</button>
    <button id="btnReload" onclick="sendAct({type:'reload'})">↻</button>
    <button id="btnTab" class="btn-tab" onclick="sendAct({type:'cycle_tab'})">🗂️ 탭</button>
    <button id="btnDone" class="btn-done" onclick="finishAuth()">✅ 완료·저장</button>
    <div class="meta">
      <div class="status" id="st">...</div>
      <div class="ttl" id="ttl"></div>
    </div>
  </div>
  <div class="stage">
    <canvas id="screen" width="760" height="980"></canvas>
  </div>
  <div class="scroll-pad">
    <button onclick="sendAct({type:'wheel', dy:-260})">▲</button>
    <button onclick="sendAct({type:'wheel', dy:260})">▼</button>
  </div>
<script>
const BOOT = __AUTH_BOOTSTRAP__;
const VDICT = {
  ko: {
    user: "🔑 ID 입력", pass: "🔒 PW 입력", type: "⌨️ 직접입력", copy: "📋 복사",
    copyTitle: "선택 텍스트 또는 화면의 인증 코드를 클립보드로 복사",
    back: "뒤로", reload: "새로고침", tab: "🗂️ 탭",
    done: "✅ 완료·저장", saving: "저장 중...", saved: "✓ 저장됨",
    connecting: "원격 브라우저 연결 중...",
    connected: "실시간 연결됨 — 화면을 직접 클릭하여 로그인을 진행하세요.",
    closed: "세션이 종료되었습니다. 이제 이 창을 닫으셔도 됩니다.",
    prompt: "현재 선택된 입력칸에 타이핑할 텍스트(인증번호·이메일 등)를 입력하세요:",
    copiedToast: "📋 클립보드에 복사되었습니다! 바로 붙여넣을 수 있습니다.",
    savedAlert: "세션 저장이 완료되었습니다! 이 창을 닫으셔도 됩니다."
  },
  en: {
    user: "🔑 Fill ID", pass: "🔒 Fill PW", type: "⌨️ Type", copy: "📋 Copy",
    copyTitle: "Copy selected text or authorization code to clipboard",
    back: "Back", reload: "Reload", tab: "🗂️ Tabs",
    done: "✅ Done & Save", saving: "Saving...", saved: "✓ Saved",
    connecting: "Connecting to remote browser...",
    connected: "Connected — click directly on the screen to sign in.",
    closed: "Session ended. You may close this panel.",
    prompt: "Enter text to type into the focused input field:",
    copiedToast: "📋 Copied to clipboard! Ready to paste.",
    savedAlert: "Session saved! You may close this window."
  }
};

function detectLang() {
  try {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'ko' || q === 'en') return q;
    const ls = (localStorage.getItem('tuner_lang') || '').toLowerCase();
    if (ls.startsWith('ko')) return 'ko';
    if (ls.startsWith('en')) return 'en';
  } catch (_) {}
  return String(navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'ko';
}

let vLang = detectLang();
let tabCount = 1;
let doneState = 0; // 0=open, 1=saving, 2=saved
const vt = (k) => (VDICT[vLang] || VDICT.ko)[k] || k;

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const st = document.getElementById('st');
const ttlEl = document.getElementById('ttl');
const btnTab = document.getElementById('btnTab');
if (!BOOT.has_username) document.getElementById('btnUser').disabled = true;
if (!BOOT.has_password) document.getElementById('btnPass').disabled = true;

function applyViewerLang(next) {
  if (next === 'ko' || next === 'en') vLang = next;
  document.documentElement.lang = vLang;
  document.getElementById('btnUser').textContent = vt('user');
  document.getElementById('btnPass').textContent = vt('pass');
  document.getElementById('btnType').textContent = vt('type');
  const cp = document.getElementById('btnCopy');
  cp.textContent = vt('copy');
  cp.title = vt('copyTitle');
  document.getElementById('btnBack').title = vt('back');
  document.getElementById('btnReload').title = vt('reload');
  if (tabCount > 1) btnTab.textContent = `${vt('tab')}(${tabCount})`;
  const dBtn = document.getElementById('btnDone');
  dBtn.textContent = doneState === 2 ? vt('saved') : doneState === 1 ? vt('saving') : vt('done');
}
applyViewerLang(vLang);
st.textContent = vt('connecting');

window.addEventListener('message', (ev) => {
  if (ev.origin === location.origin && ev.data && ev.data.type === 'tuner_set_lang') {
    applyViewerLang(ev.data.lang);
  }
});

let remSecs = BOOT.ttl_secs || 0;
function renderTtl() {
  const m = Math.floor(remSecs / 60);
  const s = String(remSecs % 60).padStart(2, '0');
  ttlEl.textContent = `[${BOOT.site_key}] ${m}:${s}`;
}
renderTtl();
setInterval(() => { if (remSecs > 0) { remSecs--; renderTtl(); } }, 1000);

const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = proto + '//' + location.host + location.pathname.replace(/\/$/, '') + '/ws';
const ws = new WebSocket(wsUrl);
ws.binaryType = 'arraybuffer';

ws.onopen = () => { st.textContent = vt('connected'); };
ws.onclose = () => { st.textContent = vt('closed'); };
ws.onmessage = (ev) => {
  if (typeof ev.data === 'string') {
    try {
      const m = JSON.parse(ev.data);
      if (typeof m.tab_count === 'number') {
        tabCount = m.tab_count;
        btnTab.style.display = tabCount > 1 ? 'inline-block' : 'none';
        btnTab.textContent = `${vt('tab')}(${tabCount})`;
      }
      if (m.url) st.textContent = m.url;
      if (m.msg) st.textContent = m.msg;
      if (m.clipboard) {
        st.textContent = vt('copiedToast');
        try { navigator.clipboard && navigator.clipboard.writeText(m.clipboard).catch(() => {}); } catch (_) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'tuner_hitl_clipboard', site_key: BOOT.site_key, text: m.clipboard }, location.origin);
          } else if (window.opener) {
            window.opener.postMessage({ type: 'tuner_hitl_clipboard', site_key: BOOT.site_key, text: m.clipboard }, location.origin);
          }
        } catch (_) {}
      }
      if (m.done) {
        doneState = 2;
        const doneBtn = document.getElementById('btnDone');
        doneBtn.disabled = true;
        doneBtn.textContent = vt('saved');
        st.textContent = vt('savedAlert');
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'tuner_hitl_done', site_key: BOOT.site_key }, location.origin);
          } else {
            alert(vt('savedAlert'));
          }
        } catch (_) {}
      }
    } catch (_) {}
    return;
  }
  const blob = new Blob([ev.data], {type: 'image/jpeg'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    if (img.naturalWidth > 0 && img.naturalHeight > 0 &&
        (canvas.width !== img.naturalWidth || canvas.height !== img.naturalHeight)) {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
    }
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
  };
  img.src = url;
};

function sendAct(obj) {
  if (ws.readyState === 1) ws.send(JSON.stringify(obj));
}

function getCoords(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.max(0, Math.min(canvas.width - 1, Math.round((e.clientX - r.left) * (canvas.width / r.width))));
  const y = Math.max(0, Math.min(canvas.height - 1, Math.round((e.clientY - r.top) * (canvas.height / r.height))));
  return {x, y};
}

let isDown = false;
let lastMove = 0;

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  isDown = true;
  const {x, y} = getCoords(e);
  sendAct({type: 'mousedown', x, y});
});

canvas.addEventListener('pointermove', (e) => {
  if (!isDown) return;
  e.preventDefault();
  const now = Date.now();
  if (now - lastMove < 28) return;
  lastMove = now;
  const {x, y} = getCoords(e);
  sendAct({type: 'mousemove', x, y});
});

canvas.addEventListener('pointerup', (e) => {
  if (!isDown) return;
  e.preventDefault();
  isDown = false;
  const {x, y} = getCoords(e);
  sendAct({type: 'mouseup', x, y});
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  sendAct({type: 'wheel', dy: Math.round(e.deltaY)});
}, {passive: false});

function promptText() {
  const txt = prompt(vt('prompt'));
  if (txt) sendAct({type: 'text', text: txt});
}

function finishAuth() {
  doneState = 1;
  document.getElementById('btnDone').textContent = vt('saving');
  sendAct({type: 'save_and_exit'});
}
</script>
</body>
</html>
