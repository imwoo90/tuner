<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuner File Review</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --tab-bg: #21262d;
      --tab-active: #388bfd33;
      --tab-active-border: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 12px;
      background: var(--tab-bg);
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    button.btn {
      background: var(--tab-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    button.btn:hover { background: var(--border); }
    button.btn:active { transform: scale(0.97); }
    .btn-toggle {
      background: #1f6feb22 !important;
      border-color: #388bfd !important;
      color: #58a6ff !important;
    }
    .tabs-wrapper {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      overflow-x: auto;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }
    .tab-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      margin-right: 6px;
      font-size: 13px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .tab-item.active {
      background: var(--tab-active);
      color: #fff;
      border-color: var(--tab-active-border);
      font-weight: 500;
    }
    .tab-size {
      font-size: 10px;
      color: var(--text-muted);
    }
    .meta-bar {
      padding: 6px 14px;
      background: #090d12;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .meta-path {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
      color: var(--accent);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      max-width: 65%;
    }
    .code-container {
      flex: 1;
      overflow: auto;
      background: #090d12;
      display: block;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 20px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      tab-size: 4;
    }
    .code-lines {
      display: flex;
      flex-direction: column;
      min-width: 100%;
      width: max-content;
      padding: 10px 0;
    }
    .code-line {
      display: flex;
      align-items: stretch;
      min-height: 20px;
      line-height: 20px;
    }
    .code-line:hover {
      background: #161b2288;
    }
    .ln {
      position: sticky;
      left: 0;
      z-index: 2;
      flex-shrink: 0;
      min-width: 48px;
      padding: 0 10px 0 12px;
      text-align: right;
      color: #6e7681;
      user-select: none;
      -webkit-user-select: none;
      border-right: 1px solid #21262d;
      background: #0d1117;
      font-variant-numeric: tabular-nums;
    }
    .lc {
      flex: 1;
      padding: 0 16px 0 12px;
      white-space: pre;
      color: #e6edf3;
    }
    pre { margin: 0; font-family: inherit; font-size: inherit; line-height: inherit; }
    code.hljs { padding: 0; background: transparent; font-family: inherit; font-size: inherit; line-height: inherit; }

    /* Markdown Container Styling */
    .markdown-container {
      flex: 1;
      overflow: auto;
      background: #0d1117;
      padding: 16px 20px;
      color: #c9d1d9;
      line-height: 1.6;
      font-size: 14px;
    }
    .markdown-container h1, .markdown-container h2, .markdown-container h3, .markdown-container h4 {
      color: #f0f6fc;
      margin-top: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .markdown-container h1, .markdown-container h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .markdown-container p, .markdown-container ul, .markdown-container ol {
      margin-bottom: 14px;
    }
    .markdown-container ul, .markdown-container ol {
      padding-left: 24px;
    }
    .markdown-container li {
      margin-bottom: 4px;
    }
    .markdown-container code:not(.hljs) {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12.5px;
      color: #f0f6fc;
    }
    .markdown-container pre {
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .markdown-container pre code.hljs {
      padding: 0;
      background: transparent;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .markdown-container table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
      display: block;
      overflow-x: auto;
    }
    .markdown-container th, .markdown-container td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-container th {
      background: #161b22;
      color: #f0f6fc;
    }
    .markdown-container blockquote {
      border-left: 4px solid var(--accent);
      color: var(--text-muted);
      padding: 4px 14px;
      margin-bottom: 14px;
      background: #161b2255;
      border-radius: 0 4px 4px 0;
    }
    .markdown-container a {
      color: var(--accent);
      text-decoration: none;
    }
    .markdown-container a:hover {
      text-decoration: underline;
    }
    .markdown-container .mermaid {
      display: flex;
      justify-content: center;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
    }
    .markdown-container .mermaid svg {
      max-width: 100%;
      height: auto;
    }

    /* Media Container Styling */
    .media-container {
      flex: 1;
      overflow: auto;
      background: #090d12;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .media-container video {
      max-width: 100%;
      max-height: calc(100vh - 140px);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      outline: none;
      background: #000;
    }
    .media-container audio {
      width: 90%;
      max-width: 500px;
      margin: 40px 0;
      outline: none;
    }
    .media-container img {
      max-width: 100%;
      max-height: calc(100vh - 140px);
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .binary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 40px;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .binary-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .binary-name {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .binary-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span class="header-title">🔍 Tuner Review</span>
      <span id="file-count" class="badge">0 files</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-toggle" id="btn-toggle-view" style="display:none;" onclick="toggleMarkdownView()">📝 코드</button>
      <button class="btn" id="btn-copy" onclick="copyCurrentCode()">📋 복사</button>
      <button class="btn" id="btn-download" onclick="downloadCurrentFile()">📥 다운로드</button>
      <button class="btn" id="btn-close" onclick="closeViewer()">✕ 닫기</button>
    </div>
  </header>

  <div class="tabs-wrapper" id="tabs-container"></div>

  <div class="meta-bar">
    <span class="meta-path" id="file-path">-</span>
    <span id="file-stats">-</span>
  </div>

  <div class="code-container" id="code-container">
    <div class="code-lines hljs" id="code-lines"></div>
  </div>

  <div class="markdown-container" id="markdown-container" style="display:none;"></div>
  <div class="media-container" id="media-container" style="display:none;"></div>

  <script id="files-data" type="application/json">__FILES_JSON__</script>
  <script>
    const TOKEN = "__TOKEN__";
    let FILES = [];
    try {
      FILES = JSON.parse(document.getElementById('files-data').textContent);
    } catch (e) {
      console.error('Failed to parse files JSON:', e);
    }
    let activeIndex = 0;
    let isMarkdownRendered = true;

    function getFileIcon(f) {
      if (f.language === 'video') return '🎬';
      if (f.language === 'audio') return '🎵';
      if (f.language === 'image' || f.language === 'svg') return '🖼️';
      if (f.language === 'html') return '🌐';
      if (f.language === 'markdown') return '📝';
      if (f.is_binary) return '📦';
      return '📄';
    }

    function stopMediaPlayback() {
      const mc = document.getElementById('media-container');
      if (!mc) return;
      const video = mc.querySelector('video');
      if (video) { video.pause(); video.src = ''; }
      const audio = mc.querySelector('audio');
      if (audio) { audio.pause(); audio.src = ''; }
      const iframe = mc.querySelector('iframe');
      if (iframe) { iframe.src = 'about:blank'; }
    }

    function init() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      if (window.mermaid) {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'loose',
          themeVariables: {
            darkMode: true,
            background: '#161b22',
            primaryColor: '#1f6feb',
            primaryTextColor: '#c9d1d9',
            primaryBorderColor: '#388bfd',
            lineColor: '#58a6ff',
            secondaryColor: '#238636',
            tertiaryColor: '#21262d'
          }
        });
      }

      document.getElementById('file-count').innerText = `${FILES.length}개 파일`;
      const tabsContainer = document.getElementById('tabs-container');
      tabsContainer.innerHTML = '';

      FILES.forEach((f, idx) => {
        const tab = document.createElement('div');
        tab.className = `tab-item ${idx === 0 ? 'active' : ''}`;
        tab.id = `tab-${idx}`;
        tab.onclick = () => selectFile(idx);
        const icon = getFileIcon(f);
        tab.innerHTML = `<span>${icon} ${escapeHtml(f.filename)}</span><span class="tab-size">${formatBytes(f.size_bytes)}</span>`;
        tabsContainer.appendChild(tab);
      });

      if (FILES.length > 0) {
        selectFile(0);
      }
    }

    function selectFile(idx) {
      if (idx < 0 || idx >= FILES.length) return;
      stopMediaPlayback();
      activeIndex = idx;

      FILES.forEach((_, i) => {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) tab.classList.toggle('active', i === idx);
      });

      const file = FILES[idx];
      document.getElementById('file-path').innerText = file.path || file.filename;

      const copyBtn = document.getElementById('btn-copy');
      const toggleBtn = document.getElementById('btn-toggle-view');
      const codeContainer = document.getElementById('code-container');
      const mdContainer = document.getElementById('markdown-container');
      const mediaContainer = document.getElementById('media-container');

      const encodedFilename = encodeURIComponent(file.filename);
      const mediaUrl = `/review/${TOKEN}/media/${encodedFilename}`;

      if (file.language === 'video') {
        document.getElementById('file-stats').innerText = `Video · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <video controls playsinline preload="metadata" src="${mediaUrl}">
            브라우저가 비디오 재생을 지원하지 않습니다.
          </video>
        `;
      } else if (file.language === 'audio') {
        document.getElementById('file-stats').innerText = `Audio · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <audio controls preload="metadata" src="${mediaUrl}">
            브라우저가 오디오 재생을 지원하지 않습니다.
          </audio>
        `;
      } else if (file.language === 'image') {
        document.getElementById('file-stats').innerText = `Image · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <img src="${mediaUrl}" alt="${escapeHtml(file.filename)}" />
        `;
      } else if (file.language === 'pdf') {
        document.getElementById('file-stats').innerText = `PDF · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <iframe src="${mediaUrl}" style="width:100%;height:100%;border:none;border-radius:8px;background:#fff;" title="${escapeHtml(file.filename)}"></iframe>
        `;
      } else if (file.is_binary) {
        document.getElementById('file-stats').innerText = `Binary · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <div class="binary-card">
            <div class="binary-icon">📦</div>
            <div class="binary-name">${escapeHtml(file.filename)}</div>
            <div class="binary-desc">이 파일은 바이너리 파일로 직접 텍스트 미리보기를 지원하지 않습니다.</div>
            <button class="btn" style="background:#238636;color:#fff;padding:8px 16px;font-size:13px;" onclick="downloadCurrentFile()">📥 파일 다운로드</button>
          </div>
        `;
      } else {
        // Text / Code / Markdown
        copyBtn.style.display = 'inline-flex';
        mediaContainer.style.display = 'none';
        mediaContainer.innerHTML = '';

        const normalizedContent = (file.content || '').replace(/\r\n/g, '\n');
        const lines = normalizedContent.split('\n');
        const lineCount = lines.length;
        const maxLineLen = lines.reduce((m, l) => Math.max(m, l.length), 0);
        const safeContent = maxLineLen > 4000
          ? lines.map(l => l.length > 4000 ? l.slice(0, 4000) + ' ... [line truncated]' : l).join('\n')
          : normalizedContent;
        const canHighlight = safeContent.length <= 100000 && maxLineLen <= 4000;
        document.getElementById('file-stats').innerText = `${lineCount} lines · ${formatBytes(file.size_bytes)}`;

        const codeLinesEl = document.getElementById('code-lines');
        codeLinesEl.className = 'code-lines hljs';
        if (file.language) {
          codeLinesEl.classList.add(`language-${file.language}`);
        }
        let highlighted = '';
        try {
          if (canHighlight && file.language && window.hljs && hljs.getLanguage(file.language)) {
            highlighted = hljs.highlight(safeContent, { language: file.language }).value;
          } else if (canHighlight && window.hljs) {
            highlighted = hljs.highlightAuto(safeContent).value;
          } else {
            highlighted = escapeHtml(safeContent);
          }
        } catch (e) {
          highlighted = escapeHtml(safeContent);
        }

        const highlightedLines = splitHighlightedLines(highlighted);
        const digits = String(lineCount).length;
        const minLnWidth = Math.max(48, digits * 9 + 22);
        codeLinesEl.innerHTML = highlightedLines
          .map((lineHtml, i) => `<div class="code-line" data-line="${i + 1}"><span class="ln" style="min-width:${minLnWidth}px">${i + 1}</span><span class="lc">${lineHtml.length > 0 ? lineHtml : ' '}</span></div>`)
          .join('');
        codeContainer.scrollTop = 0;
        codeContainer.scrollLeft = 0;
        mdContainer.scrollTop = 0;

        if (file.language === 'markdown') {
          toggleBtn.style.display = 'inline-flex';
          if (isMarkdownRendered) {
            showMarkdownView(normalizedContent);
          } else {
            showCodeView();
          }
        } else if (file.language === 'html') {
          toggleBtn.style.display = 'inline-flex';
          if (isMarkdownRendered) {
            showHtmlView(mediaUrl, file.filename);
          } else {
            showCodeView();
          }
        } else {
          toggleBtn.style.display = 'none';
          showCodeView();
        }
      }
    }

    function splitHighlightedLines(html) {
      const rawLines = html.split('\n');
      const openTags = [];
      const tagRegex = /<\/?span[^>]*>/gi;
      return rawLines.map(line => {
        const prefix = openTags.join('');
        let m;
        tagRegex.lastIndex = 0;
        while ((m = tagRegex.exec(line)) !== null) {
          const tag = m[0];
          if (tag.startsWith('</')) {
            openTags.pop();
          } else if (!tag.endsWith('/>')) {
            openTags.push(tag);
          }
        }
        const suffix = '</span>'.repeat(openTags.length);
        return prefix + line + suffix;
      });
    }

    function showCodeView() {
      document.getElementById('code-container').style.display = 'block';
      document.getElementById('markdown-container').style.display = 'none';
      const mc = document.getElementById('media-container');
      mc.style.display = 'none';
      mc.innerHTML = '';
      const toggleBtn = document.getElementById('btn-toggle-view');
      toggleBtn.innerText = '👁️ 렌더';
    }

    function showHtmlView(mediaUrl, filename) {
      document.getElementById('code-container').style.display = 'none';
      document.getElementById('markdown-container').style.display = 'none';
      const mc = document.getElementById('media-container');
      mc.style.display = 'flex';
      mc.innerHTML = `
        <iframe src="${mediaUrl}" style="width:100%;height:calc(100vh - 140px);border:none;border-radius:8px;background:#fff;" title="${escapeHtml(filename)}"></iframe>
      `;
      const toggleBtn = document.getElementById('btn-toggle-view');
      toggleBtn.innerText = '📝 코드';
    }

    function showMarkdownView(content) {
      document.getElementById('code-container').style.display = 'none';
      const mdContainer = document.getElementById('markdown-container');
      mdContainer.style.display = 'block';
      const toggleBtn = document.getElementById('btn-toggle-view');
      toggleBtn.innerText = '📝 코드';

      if (window.marked) {
        const renderer = new marked.Renderer();
        renderer.code = function(arg1, arg2) {
          const text = (typeof arg1 === 'object' && arg1 !== null) ? arg1.text : arg1;
          const lang = (typeof arg1 === 'object' && arg1 !== null) ? arg1.lang : arg2;
          
          if (lang === 'mermaid' || lang === 'uml') {
            return `<div class="mermaid">${escapeHtml(text)}</div>`;
          }
          let codeHtml = '';
          try {
            if (lang && hljs.getLanguage(lang)) {
              codeHtml = hljs.highlight(text, { language: lang }).value;
            } else {
              codeHtml = hljs.highlightAuto(text).value;
            }
          } catch (_) {
            codeHtml = escapeHtml(text);
          }
          return `<pre><code class="hljs ${lang ? 'language-' + lang : ''}">${codeHtml}</code></pre>`;
        };

        mdContainer.innerHTML = marked.parse(content, { renderer, gfm: true, breaks: true });

        if (window.mermaid) {
          mermaid.run({ querySelector: '#markdown-container .mermaid' }).catch(err => {
            console.warn('Mermaid rendering warning:', err);
          });
        }
      } else {
        mdContainer.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
      }
    }

    function toggleMarkdownView() {
      const file = FILES[activeIndex];
      if (!file || (file.language !== 'markdown' && file.language !== 'html')) return;
      isMarkdownRendered = !isMarkdownRendered;
      if (isMarkdownRendered) {
        if (file.language === 'html') {
          const mediaUrl = `/review/${TOKEN}/media/${encodeURIComponent(file.filename)}`;
          showHtmlView(mediaUrl, file.filename);
        } else {
          showMarkdownView((file.content || '').replace(/\r\n/g, '\n'));
        }
      } else {
        showCodeView();
      }
    }

    function copyCurrentCode() {
      if (!FILES[activeIndex]) return;
      navigator.clipboard.writeText(FILES[activeIndex].content).then(() => {
        const btn = document.getElementById('btn-copy');
        const orig = btn.innerText;
        btn.innerText = '✓ 완료!';
        btn.style.borderColor = '#3fb950';
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.borderColor = '';
        }, 1500);
      });
    }

    function downloadCurrentFile() {
      if (!FILES[activeIndex]) return;
      const file = FILES[activeIndex];
      const downloadUrl = `/review/${TOKEN}/download/${encodeURIComponent(file.filename)}`;
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.setAttribute('download', file.filename);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function closeViewer() {
      stopMediaPlayback();
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
        window.Telegram.WebApp.close();
      } else {
        window.close();
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
