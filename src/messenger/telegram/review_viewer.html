<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tuner File Review</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #111827;
      --panel-2: #1e293b;
      --border: #263248;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --tab-bg: #161f30;
      --tab-active: rgba(56, 189, 248, 0.18);
      --tab-active-border: #38bdf8;
      --green: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .desktop-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      white-space: nowrap;
    }
    /* Mobile File Drawer Trigger Pill */
    .mobile-file-trigger {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid #334155;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
      min-width: 0;
      cursor: pointer;
    }
    .mobile-file-trigger-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }
    .mobile-file-trigger-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Desktop Meta Bar inline in Header */
    .meta-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #090d14;
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 0;
      max-width: 52vw;
    }
    .meta-path {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
      color: var(--accent);
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    #file-stats {
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 11px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    button.btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.14s ease;
      white-space: nowrap;
    }
    button.btn:hover { background: #334155; }
    button.btn:active { transform: scale(0.97); }
    .btn-toggle, button.btn.active {
      background: var(--accent-soft) !important;
      border-color: var(--accent) !important;
      color: var(--accent) !important;
    }
    .btn-download-primary {
      background: #166534 !important;
      border-color: #22c55e !important;
      color: #fff !important;
    }
    .kbd {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      background: #090d14;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* Mobile Category Strip + Hidden/Synchronized Quick Tabs */
    .mobile-cat-bar {
      display: none;
      background: #0e1420;
      border-bottom: 1px solid var(--border);
      padding: 6px 10px;
      overflow-x: auto;
      white-space: nowrap;
      gap: 6px;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .mobile-cat-bar::-webkit-scrollbar { display: none; }
    .tabs-wrapper {
      display: none;
    }

    /* Main Split Workbench Layout */
    .workbench {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }
    body.zen-mode .sidebar,
    body.zen-mode .mobile-cat-bar {
      display: none !important;
    }

    /* Desktop Left Sidebar Explorer (>= 900px) */
    .sidebar {
      width: 280px;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-search-wrap {
      padding: 10px 10px 6px;
    }
    .sidebar-search {
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid #334155;
      background: #090d14;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .sidebar-search:focus { border-color: var(--accent); }
    .cat-chips {
      padding: 4px 10px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      border-bottom: 1px solid var(--border);
    }
    .chip {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      background: var(--tab-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .sidebar-tree {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 14px;
    }
    .group-header {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      padding: 10px 6px 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tree-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbd5e1;
      cursor: pointer;
      margin-bottom: 2px;
      border-left: 3px solid transparent;
    }
    .tree-item:hover { background: rgba(255, 255, 255, 0.04); }
    .tree-item.active {
      background: var(--accent-soft);
      color: #fff;
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .tree-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .tree-item-size {
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      background: #090d14;
    }

    /* Viewport Area */
    .viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: #080b11;
    }

    /* Code Container */
    .code-container {
      flex: 1;
      overflow: auto;
      background: #080b11;
      display: block;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 20px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      tab-size: 4;
      padding-bottom: 64px;
      user-select: text;
      -webkit-user-select: text;
    }
    .code-lines {
      display: flex;
      flex-direction: column;
      min-width: 100%;
      width: max-content;
      padding: 10px 0;
    }
    .code-line {
      display: flex;
      align-items: stretch;
      min-height: 20px;
      line-height: 20px;
    }
    .code-line:hover { background: #161b2288; }
    .ln {
      position: sticky;
      left: 0;
      z-index: 2;
      flex-shrink: 0;
      min-width: 48px;
      padding: 0 10px 0 12px;
      text-align: right;
      color: #64748b;
      user-select: none;
      border-right: 1px solid #1e293b;
      background: #0b0f17;
      font-variant-numeric: tabular-nums;
    }
    .lc {
      flex: 1;
      padding: 0 16px 0 12px;
      white-space: pre;
      color: #e6edf3;
    }
    pre { margin: 0; font-family: inherit; font-size: inherit; line-height: inherit; }
    code.hljs { padding: 0; background: transparent; font-family: inherit; font-size: inherit; line-height: inherit; }

    /* Markdown Container */
    .markdown-container {
      flex: 1;
      overflow: auto;
      background: #0b0f17;
      padding: 20px 24px 72px;
      color: #cbd5e1;
      line-height: 1.65;
      font-size: 14px;
      user-select: text;
      -webkit-user-select: text;
    }
    .markdown-container h1, .markdown-container h2, .markdown-container h3, .markdown-container h4 {
      color: #f8fafc;
      margin-top: 20px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .markdown-container h1, .markdown-container h2 {
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    .markdown-container p, .markdown-container ul, .markdown-container ol { margin-bottom: 14px; }
    .markdown-container ul, .markdown-container ol { padding-left: 24px; }
    .markdown-container li { margin-bottom: 4px; }
    .markdown-container code:not(.hljs) {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12.5px;
      color: #f8fafc;
    }
    .markdown-container pre {
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin-bottom: 14px;
    }
    .markdown-container table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 16px;
      display: block;
      overflow-x: auto;
    }
    .markdown-container th, .markdown-container td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-container th { background: #111827; color: #f8fafc; }
    .markdown-container blockquote {
      border-left: 4px solid var(--accent);
      color: var(--text-muted);
      padding: 6px 14px;
      margin-bottom: 14px;
      background: #11182788;
      border-radius: 0 6px 6px 0;
    }
    .markdown-container a { color: var(--accent); text-decoration: none; }
    .markdown-container .mermaid {
      display: flex;
      justify-content: center;
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
    }

    /* Media / Image Zoom Stage / ZIP Inspector */
    .media-container {
      flex: 1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #111827, #070a0f);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px 16px 64px;
    }
    .media-container.scrollable-stage {
      overflow-y: auto;
      justify-content: flex-start;
    }
    .zoom-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }
    .zoom-stage:active { cursor: grabbing; }
    .zoom-stage img {
      max-width: 100%;
      max-height: calc(100vh - 150px);
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
      transform-origin: center center;
      transition: transform 0.08s ease-out;
      pointer-events: none;
    }
    .media-container video {
      max-width: 100%;
      max-height: calc(100vh - 150px);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      background: #000;
    }
    .media-container audio {
      width: 90%;
      max-width: 500px;
      margin: 40px 0;
    }
    .binary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 36px;
      text-align: center;
      max-width: 460px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }
    .binary-icon { font-size: 46px; margin-bottom: 12px; }
    .binary-name { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; word-break: break-all; }
    .binary-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

    /* Built-in ZIP Archive Inspector Card */
    .zip-inspector-card {
      width: 100%;
      max-width: 780px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      margin: 8px auto 32px;
    }
    .zip-head {
      padding: 14px 18px;
      background: #161f30;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .zip-title { font-size: 15px; font-weight: 700; color: #fff; word-break: break-all; }
    .zip-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .zip-entries {
      max-height: calc(100vh - 260px);
      overflow-y: auto;
    }
    .zip-row {
      padding: 9px 18px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12.5px;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .zip-row:last-child { border-bottom: none; }
    .zip-row-name { color: #e2e8f0; word-break: break-all; }
    .zip-row-size { color: var(--accent); flex-shrink: 0; font-size: 11.5px; }

    /* Multi-Image Thumbnail Gallery Grid */
    .gallery-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 76px;
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      align-content: start;
      background: #080b11;
    }
    .gallery-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
      display: flex;
      flex-direction: column;
    }
    .gallery-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .gallery-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
    }
    .gallery-thumb-wrap {
      height: 160px;
      background: #090d14;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 6px;
    }
    .gallery-thumb-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }
    .gallery-idx-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .gallery-card-meta {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
    }
    .gallery-card-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gallery-card-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Floating Bottom Thumb-Zone HUD */
    .floating-hud {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid #334155;
      backdrop-filter: blur(10px);
      border-radius: 999px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      z-index: 8;
      white-space: nowrap;
    }
    .hud-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .hud-btn:hover { background: #334155; }
    .hud-counter {
      font-size: 12px;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
      padding: 0 4px;
    }
    .hud-sep {
      width: 1px;
      height: 16px;
      background: #334155;
    }
    #hud-zoom-group {
      display: none;
      align-items: center;
      gap: 5px;
    }

    /* Mobile Bottom-Sheet File Drawer (< 900px) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      display: none;
      z-index: 30;
      align-items: flex-end;
      justify-content: center;
    }
    .drawer-backdrop.open { display: flex; }
    .drawer-sheet {
      width: 100%;
      max-width: 640px;
      max-height: 80vh;
      background: var(--card-bg);
      border-top: 1px solid #334155;
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.7);
    }
    .drawer-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .drawer-search-wrap { padding: 10px 14px 6px; }
    .drawer-tree {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 20px;
    }

    /* Responsive Mobile Layout (< 900px) */
    @media (max-width: 899px) {
      .sidebar { display: none; }
      .desktop-brand, .meta-bar, .kbd, .btn-label-desk { display: none; }
      .mobile-file-trigger { display: inline-flex; }
      .mobile-cat-bar { display: flex; }
      header { padding: 8px 10px; gap: 6px; }
      button.btn { padding: 6px 8px; }
      .gallery-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px 10px 74px;
      }
      .gallery-thumb-wrap { height: 130px; }
      .floating-hud {
        bottom: 10px;
        max-width: calc(100vw - 16px);
        padding: 5px 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="desktop-brand">
        <span class="header-title">🔍 Tuner Review</span>
        <span id="file-count" class="badge">0 files</span>
      </div>
      <!-- Mobile-only File Picker Pill -->
      <button class="mobile-file-trigger" id="btn-mobile-drawer" onclick="toggleMobileDrawer()">
        <span class="mobile-file-trigger-left">
          <span id="mobile-current-icon">📄</span>
          <span class="mobile-file-trigger-name" id="mobile-current-name">-</span>
        </span>
        <span class="badge" id="mobile-current-badge">0/0 ▾</span>
      </button>
      <div class="meta-bar">
        <span class="meta-path" id="file-path">-</span>
        <span id="file-stats">-</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn" id="btn-gallery" style="display:none;" onclick="toggleGalleryView()">⊞ <span class="btn-label-desk">갤러리</span> <span class="kbd">G</span></button>
      <button class="btn btn-toggle" id="btn-toggle-view" style="display:none;" onclick="toggleMarkdownView()">📝 <span class="btn-label-desk">코드</span> <span class="kbd">C</span></button>
      <button class="btn" id="btn-copy" onclick="copyCurrentCode()">📋 <span class="btn-label-desk">복사</span></button>
      <button class="btn" id="btn-fullscreen" onclick="toggleZenMode()">⛶ <span class="btn-label-desk">전체화면</span> <span class="kbd">F</span></button>
      <button class="btn btn-download-primary" id="btn-download" onclick="downloadCurrentFile()">📥 <span class="btn-label-desk">다운로드</span></button>
      <button class="btn" id="btn-close" onclick="closeViewer()">✕ <span class="btn-label-desk">닫기</span></button>
    </div>
  </header>

  <!-- Mobile Category Filter Strip -->
  <div class="mobile-cat-bar" id="mobile-cat-bar"></div>

  <!-- Hidden/Synchronized Quick Tabs Container (Maintains DOM compatibility for #tabs-container .tab-item) -->
  <div class="tabs-wrapper" id="tabs-container"></div>

  <div class="workbench">
    <!-- Desktop Persistent Left Sidebar Explorer -->
    <aside class="sidebar" id="desktop-sidebar">
      <div class="sidebar-search-wrap">
        <input class="sidebar-search" id="sidebar-search" placeholder="🔍 파일 검색 (/ 키)..." oninput="handleSearchInput(this.value)" />
      </div>
      <div class="cat-chips" id="desktop-cat-chips"></div>
      <div class="sidebar-tree" id="sidebar-tree"></div>
      <div class="sidebar-footer">
        <span>↑↓/←→ 이동</span>
        <span>G 갤러리</span>
        <span>F 전체화면</span>
      </div>
    </aside>

    <!-- Main Inspection Viewport -->
    <main class="viewport">
      <div class="code-container" id="code-container">
        <div class="code-lines hljs" id="code-lines"></div>
      </div>

      <div class="markdown-container" id="markdown-container" style="display:none;"></div>
      <div class="media-container" id="media-container" style="display:none;"></div>
      <div class="gallery-container" id="gallery-container" style="display:none;"></div>

      <!-- Floating Bottom Thumb-Zone Navigation & Zoom HUD -->
      <div class="floating-hud" id="floating-hud">
        <button class="hud-btn" onclick="stepFile(-1)">◀ 이전</button>
        <span class="hud-counter" id="hud-counter">0 / 0</span>
        <button class="hud-btn" onclick="stepFile(1)">다음 ▶</button>
        <div id="hud-zoom-group">
          <div class="hud-sep"></div>
          <button class="hud-btn" onclick="resetImageZoom()" id="hud-zoom-label">100%</button>
          <button class="hud-btn" onclick="adjustImageZoom(0.4)">🔍+</button>
          <button class="hud-btn" onclick="adjustImageZoom(-0.4)">🔍-</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Mobile Bottom-Sheet File Drawer -->
  <div class="drawer-backdrop" id="mobile-drawer-backdrop" onclick="if(event.target===this) toggleMobileDrawer(false)">
    <div class="drawer-sheet">
      <div class="drawer-header">
        <span id="drawer-title">📂 참조 파일 목록</span>
        <button class="btn" onclick="toggleMobileDrawer(false)">✕ 닫기</button>
      </div>
      <div class="drawer-search-wrap">
        <input class="sidebar-search" id="drawer-search" placeholder="🔍 파일명 검색..." oninput="handleSearchInput(this.value)" />
      </div>
      <div class="cat-chips" id="drawer-cat-chips"></div>
      <div class="drawer-tree" id="drawer-tree"></div>
    </div>
  </div>

  <script id="files-data" type="application/json">__FILES_JSON__</script>
  <script>
    const TOKEN = "__TOKEN__";
    let FILES = [];
    try {
      FILES = JSON.parse(document.getElementById('files-data').textContent);
    } catch (e) {
      console.error('Failed to parse files JSON:', e);
    }
    let activeIndex = 0;
    let isMarkdownRendered = true;
    let isGalleryMode = false;
    let activeCategory = 'all';
    let searchQuery = '';

    // Image Zoom & Pan state
    let imgScale = 1.0;
    let imgPanX = 0;
    let imgPanY = 0;
    let isDraggingImg = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let pinchStartDist = 0;
    let pinchStartScale = 1.0;
    let touchStartX = 0;
    let touchStartY = 0;
    let lastTapTime = 0;

    const CATEGORY_META = {
      all:     { label: '전체', icon: '📂' },
      html:    { label: '3D·웹', icon: '🌐' },
      image:   { label: '이미지·도면', icon: '🖼️' },
      doc:     { label: '문서·PDF', icon: '📄' },
      code:    { label: '코드·데이터', icon: '💻' },
      archive: { label: '패키지·미디어', icon: '📦' }
    };

    function getFileCategory(f) {
      if (f.language === 'html') return 'html';
      if (f.language === 'image' || f.language === 'svg') return 'image';
      if (f.language === 'pdf' || f.language === 'markdown') return 'doc';
      if (f.language === 'zip' || f.language === 'video' || f.language === 'audio' || f.is_binary) return 'archive';
      return 'code';
    }

    function getFileIcon(f) {
      if (f.language === 'video') return '🎬';
      if (f.language === 'audio') return '🎵';
      if (f.language === 'image' || f.language === 'svg') return '🖼️';
      if (f.language === 'html') return '🌐';
      if (f.language === 'pdf') return '📕';
      if (f.language === 'markdown') return '📝';
      if (f.language === 'zip') return '📦';
      if (f.is_binary) return '📦';
      return '📄';
    }

    function stopMediaPlayback() {
      const mc = document.getElementById('media-container');
      if (!mc) return;
      const video = mc.querySelector('video');
      if (video) { video.pause(); video.src = ''; }
      const audio = mc.querySelector('audio');
      if (audio) { audio.pause(); audio.src = ''; }
      const iframe = mc.querySelector('iframe');
      if (iframe) { iframe.src = 'about:blank'; }
    }

    function init() {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      if (window.mermaid) {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'loose',
          themeVariables: {
            darkMode: true,
            background: '#111827',
            primaryColor: '#0284c7',
            primaryTextColor: '#e2e8f0',
            primaryBorderColor: '#38bdf8',
            lineColor: '#38bdf8',
            secondaryColor: '#166534',
            tertiaryColor: '#1e293b'
          }
        });
      }

      document.getElementById('file-count').innerText = `${FILES.length}개 파일`;
      document.getElementById('drawer-title').innerText = `📂 참조 파일 전체 목록 (${FILES.length}개)`;

      // Populate compatibility #tabs-container
      const tabsContainer = document.getElementById('tabs-container');
      tabsContainer.innerHTML = '';
      FILES.forEach((f, idx) => {
        const tab = document.createElement('div');
        tab.className = `tab-item ${idx === 0 ? 'active' : ''}`;
        tab.id = `tab-${idx}`;
        tab.onclick = () => selectFile(idx);
        const icon = getFileIcon(f);
        tab.innerHTML = `<span>${icon} ${escapeHtml(f.filename)}</span><span class="tab-size">${formatBytes(f.size_bytes)}</span>`;
        tabsContainer.appendChild(tab);
      });

      // Show gallery button if >= 2 images exist
      const imageFiles = FILES.map((f, idx) => ({ f, idx })).filter(x => x.f.language === 'image' || x.f.language === 'svg');
      const galleryBtn = document.getElementById('btn-gallery');
      if (imageFiles.length >= 2) {
        galleryBtn.style.display = 'inline-flex';
        buildGalleryGrid(imageFiles);
      }

      renderCategoryChips();
      renderFileTrees();
      setupKeyboardShortcuts();

      if (FILES.length > 0) {
        selectFile(0);
      }
    }

    function renderCategoryChips() {
      const counts = { all: FILES.length, html: 0, image: 0, doc: 0, code: 0, archive: 0 };
      FILES.forEach(f => {
        const cat = getFileCategory(f);
        counts[cat] = (counts[cat] || 0) + 1;
      });

      const deskContainer = document.getElementById('desktop-cat-chips');
      const mobContainer = document.getElementById('mobile-cat-bar');
      const drawerContainer = document.getElementById('drawer-cat-chips');
      deskContainer.innerHTML = '';
      mobContainer.innerHTML = '';
      if (drawerContainer) drawerContainer.innerHTML = '';

      Object.keys(CATEGORY_META).forEach(cat => {
        if (cat !== 'all' && !counts[cat]) return;
        const meta = CATEGORY_META[cat];
        const makeChip = () => {
          const el = document.createElement('span');
          el.className = `chip ${activeCategory === cat ? 'active' : ''}`;
          el.onclick = () => selectCategory(cat);
          el.innerHTML = `${meta.icon} ${meta.label} <b>${counts[cat]}</b>`;
          return el;
        };
        deskContainer.appendChild(makeChip());
        mobContainer.appendChild(makeChip());
        if (drawerContainer) drawerContainer.appendChild(makeChip());
      });
    }

    function updateFilterCounters() {
      const filtered = getFilteredIndices();
      const posInFilter = filtered.indexOf(activeIndex);
      const displayPos = posInFilter >= 0 ? posInFilter + 1 : (filtered.length > 0 ? 1 : 0);
      const totalFiltered = filtered.length;

      document.getElementById('mobile-current-badge').innerText = `${displayPos}/${totalFiltered} ▾`;
      document.getElementById('hud-counter').innerText = `${displayPos} / ${totalFiltered}`;

      const meta = CATEGORY_META[activeCategory] || CATEGORY_META.all;
      if (activeCategory === 'all' && !searchQuery.trim()) {
        document.getElementById('file-count').innerText = `${FILES.length}개 파일`;
        document.getElementById('drawer-title').innerText = `📂 참조 파일 전체 목록 (${FILES.length}개)`;
      } else {
        document.getElementById('file-count').innerText = `${totalFiltered} / ${FILES.length}개 파일`;
        document.getElementById('drawer-title').innerText = `${meta.icon} ${meta.label} 목록 (${totalFiltered}개)`;
      }
    }

    function selectCategory(cat) {
      activeCategory = cat;
      const matchingIndices = getFilteredIndices();
      if (matchingIndices.length > 0 && !matchingIndices.includes(activeIndex)) {
        selectFile(matchingIndices[0]);
      }
      renderCategoryChips();
      renderFileTrees();
      updateFilterCounters();
    }

    function getFilteredIndices() {
      const q = searchQuery.trim().toLowerCase();
      const result = [];
      FILES.forEach((f, idx) => {
        if (activeCategory !== 'all' && getFileCategory(f) !== activeCategory) return;
        if (q && !f.filename.toLowerCase().includes(q) && !(f.path || '').toLowerCase().includes(q)) return;
        result.push(idx);
      });
      return result;
    }

    function handleSearchInput(val) {
      searchQuery = val || '';
      const s1 = document.getElementById('sidebar-search');
      const s2 = document.getElementById('drawer-search');
      if (s1 && s1.value !== searchQuery) s1.value = searchQuery;
      if (s2 && s2.value !== searchQuery) s2.value = searchQuery;
      renderFileTrees();
      updateFilterCounters();
    }

    function renderFileTrees() {
      const indices = getFilteredIndices();
      const groups = { html: [], image: [], doc: [], code: [], archive: [] };
      indices.forEach(idx => {
        const cat = getFileCategory(FILES[idx]);
        groups[cat].push(idx);
      });

      const buildTreeHtml = (closeDrawerOnSelect) => {
        const frag = document.createDocumentFragment();
        ['html', 'image', 'doc', 'code', 'archive'].forEach(cat => {
          const list = groups[cat];
          if (!list || list.length === 0) return;
          const meta = CATEGORY_META[cat];
          const hdr = document.createElement('div');
          hdr.className = 'group-header';
          hdr.innerText = `${meta.icon} ${meta.label} (${list.length})`;
          frag.appendChild(hdr);

          list.forEach(idx => {
            const f = FILES[idx];
            const item = document.createElement('div');
            item.className = `tree-item ${idx === activeIndex ? 'active' : ''}`;
            item.dataset.idx = idx;
            item.onclick = () => {
              if (closeDrawerOnSelect) toggleMobileDrawer(false);
              selectFile(idx);
            };
            item.innerHTML = `
              <span class="tree-item-name">${getFileIcon(f)} ${escapeHtml(f.filename)}</span>
              <span class="tree-item-size">${formatBytes(f.size_bytes)}</span>
            `;
            frag.appendChild(item);
          });
        });
        return frag;
      };

      const sideTree = document.getElementById('sidebar-tree');
      const drawTree = document.getElementById('drawer-tree');
      sideTree.innerHTML = '';
      drawTree.innerHTML = '';
      sideTree.appendChild(buildTreeHtml(false));
      drawTree.appendChild(buildTreeHtml(true));
    }

    function buildGalleryGrid(imageItems) {
      const gc = document.getElementById('gallery-container');
      gc.innerHTML = '';
      imageItems.forEach(({ f, idx }, orderIdx) => {
        const mediaUrl = `/review/${TOKEN}/media/${encodeURIComponent(f.filename)}`;
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.id = `gallery-card-${idx}`;
        card.onclick = () => {
          isGalleryMode = false;
          document.getElementById('btn-gallery').classList.remove('active');
          selectFile(idx);
        };
        card.innerHTML = `
          <div class="gallery-thumb-wrap">
            <span class="gallery-idx-badge">#${orderIdx + 1} · ${formatBytes(f.size_bytes)}</span>
            <img loading="lazy" src="${mediaUrl}" alt="${escapeHtml(f.filename)}" />
          </div>
          <div class="gallery-card-meta">
            <div class="gallery-card-title">🖼️ ${escapeHtml(f.filename)}</div>
            <div class="gallery-card-sub">클릭하여 확대/상세 검수</div>
          </div>
        `;
        gc.appendChild(card);
      });
    }

    function toggleGalleryView() {
      isGalleryMode = !isGalleryMode;
      const galleryBtn = document.getElementById('btn-gallery');
      galleryBtn.classList.toggle('active', isGalleryMode);
      if (isGalleryMode) {
        stopMediaPlayback();
        document.getElementById('code-container').style.display = 'none';
        document.getElementById('markdown-container').style.display = 'none';
        document.getElementById('media-container').style.display = 'none';
        document.getElementById('gallery-container').style.display = 'grid';
        document.getElementById('hud-zoom-group').style.display = 'none';
      } else {
        document.getElementById('gallery-container').style.display = 'none';
        selectFile(activeIndex);
      }
    }

    function toggleMobileDrawer(forceState) {
      const backdrop = document.getElementById('mobile-drawer-backdrop');
      const next = typeof forceState === 'boolean' ? forceState : !backdrop.classList.contains('open');
      backdrop.classList.toggle('open', next);
    }

    function toggleZenMode() {
      document.body.classList.toggle('zen-mode');
      document.getElementById('btn-fullscreen').classList.toggle('active', document.body.classList.contains('zen-mode'));
    }

    function stepFile(delta) {
      const filtered = getFilteredIndices();
      if (filtered.length === 0) return;
      const curPos = filtered.indexOf(activeIndex);
      const nextPos = curPos >= 0
        ? (curPos + delta + filtered.length) % filtered.length
        : 0;
      if (isGalleryMode) {
        isGalleryMode = false;
        document.getElementById('btn-gallery').classList.remove('active');
      }
      selectFile(filtered[nextPos]);
    }

    function selectFile(idx) {
      if (idx < 0 || idx >= FILES.length) return;
      stopMediaPlayback();
      activeIndex = idx;
      isGalleryMode = false;
      document.getElementById('btn-gallery').classList.remove('active');
      document.getElementById('gallery-container').style.display = 'none';

      FILES.forEach((_, i) => {
        const tab = document.getElementById(`tab-${i}`);
        if (tab) tab.classList.toggle('active', i === idx);
        const gcard = document.getElementById(`gallery-card-${i}`);
        if (gcard) gcard.classList.toggle('active', i === idx);
      });

      document.querySelectorAll('.tree-item').forEach(el => {
        const match = Number(el.dataset.idx) === idx;
        el.classList.toggle('active', match);
        if (match && el.closest('#sidebar-tree')) {
          el.scrollIntoView({ block: 'nearest' });
        }
      });

      const file = FILES[idx];
      document.getElementById('file-path').innerText = file.path || file.filename;
      document.getElementById('mobile-current-icon').innerText = getFileIcon(file);
      document.getElementById('mobile-current-name').innerText = file.filename;
      updateFilterCounters();

      const copyBtn = document.getElementById('btn-copy');
      const toggleBtn = document.getElementById('btn-toggle-view');
      const codeContainer = document.getElementById('code-container');
      const mdContainer = document.getElementById('markdown-container');
      const mediaContainer = document.getElementById('media-container');
      const hudZoomGroup = document.getElementById('hud-zoom-group');

      mediaContainer.classList.remove('scrollable-stage');
      hudZoomGroup.style.display = 'none';

      const encodedFilename = encodeURIComponent(file.filename);
      const mediaUrl = `/review/${TOKEN}/media/${encodedFilename}`;

      if (file.language === 'video') {
        document.getElementById('file-stats').innerText = `Video · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <video controls playsinline preload="metadata" src="${mediaUrl}">
            브라우저가 비디오 재생을 지원하지 않습니다.
          </video>
        `;
      } else if (file.language === 'audio') {
        document.getElementById('file-stats').innerText = `Audio · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <audio controls preload="metadata" src="${mediaUrl}">
            브라우저가 오디오 재생을 지원하지 않습니다.
          </audio>
        `;
      } else if (file.language === 'image') {
        document.getElementById('file-stats').innerText = `Image · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        hudZoomGroup.style.display = 'inline-flex';
        mediaContainer.innerHTML = `
          <div class="zoom-stage" id="zoom-stage">
            <img id="zoom-img" src="${mediaUrl}" alt="${escapeHtml(file.filename)}" />
          </div>
        `;
        resetImageZoom();
        bindImageZoomStage();
      } else if (file.language === 'pdf') {
        document.getElementById('file-stats').innerText = `PDF · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <iframe src="${mediaUrl}" style="width:100%;height:100%;border:none;border-radius:8px;background:#fff;" title="${escapeHtml(file.filename)}"></iframe>
        `;
      } else if (file.language === 'zip') {
        document.getElementById('file-stats').innerText = `ZIP Archive · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.classList.add('scrollable-stage');
        renderZipInspector(file, mediaContainer);
      } else if (file.is_binary) {
        document.getElementById('file-stats').innerText = `Binary · ${formatBytes(file.size_bytes)}`;
        copyBtn.style.display = 'none';
        toggleBtn.style.display = 'none';
        codeContainer.style.display = 'none';
        mdContainer.style.display = 'none';
        mediaContainer.style.display = 'flex';
        mediaContainer.innerHTML = `
          <div class="binary-card">
            <div class="binary-icon">📦</div>
            <div class="binary-name">${escapeHtml(file.filename)}</div>
            <div class="binary-desc">이 파일은 바이너리 파일로 직접 텍스트 미리보기를 지원하지 않습니다.</div>
            <button class="btn btn-download-primary" style="padding:8px 16px;font-size:13px;" onclick="downloadCurrentFile()">📥 파일 다운로드</button>
          </div>
        `;
      } else {
        // Text / Code / Markdown / HTML
        copyBtn.style.display = 'inline-flex';
        mediaContainer.style.display = 'none';
        mediaContainer.innerHTML = '';

        const normalizedContent = (file.content || '').replace(/\r\n/g, '\n');
        const lines = normalizedContent.split('\n');
        const lineCount = lines.length;
        const maxLineLen = lines.reduce((m, l) => Math.max(m, l.length), 0);
        const safeContent = maxLineLen > 4000
          ? lines.map(l => l.length > 4000 ? l.slice(0, 4000) + ' ... [line truncated]' : l).join('\n')
          : normalizedContent;
        const canHighlight = safeContent.length <= 100000 && maxLineLen <= 4000;
        document.getElementById('file-stats').innerText = `${lineCount} lines · ${formatBytes(file.size_bytes)}`;

        const codeLinesEl = document.getElementById('code-lines');
        codeLinesEl.className = 'code-lines hljs';
        if (file.language) {
          codeLinesEl.classList.add(`language-${file.language}`);
        }
        let highlighted = '';
        try {
          if (canHighlight && file.language && window.hljs && hljs.getLanguage(file.language)) {
            highlighted = hljs.highlight(safeContent, { language: file.language }).value;
          } else if (canHighlight && window.hljs) {
            highlighted = hljs.highlightAuto(safeContent).value;
          } else {
            highlighted = escapeHtml(safeContent);
          }
        } catch (e) {
          highlighted = escapeHtml(safeContent);
        }

        const highlightedLines = splitHighlightedLines(highlighted);
        const digits = String(lineCount).length;
        const minLnWidth = Math.max(48, digits * 9 + 22);
        codeLinesEl.innerHTML = highlightedLines
          .map((lineHtml, i) => `<div class="code-line" data-line="${i + 1}"><span class="ln" style="min-width:${minLnWidth}px">${i + 1}</span><span class="lc">${lineHtml.length > 0 ? lineHtml : ' '}</span></div>`)
          .join('');
        codeContainer.scrollTop = 0;
        codeContainer.scrollLeft = 0;
        mdContainer.scrollTop = 0;

        if (file.language === 'markdown') {
          toggleBtn.style.display = 'inline-flex';
          if (isMarkdownRendered) {
            showMarkdownView(normalizedContent);
          } else {
            showCodeView();
          }
        } else if (file.language === 'html') {
          toggleBtn.style.display = 'inline-flex';
          if (isMarkdownRendered) {
            showHtmlView(mediaUrl, file.filename);
          } else {
            showCodeView();
          }
        } else {
          toggleBtn.style.display = 'none';
          showCodeView();
        }
      }
    }

    function renderZipInspector(file, container) {
      let entries = [];
      try {
        entries = JSON.parse(file.content || '[]');
      } catch (_) {
        entries = [];
      }
      const filesOnly = entries.filter(e => !e.is_dir);
      const totalUncompressed = filesOnly.reduce((acc, e) => acc + (e.size || 0), 0);

      const getZipEntryIcon = (name) => {
        const lower = name.toLowerCase();
        if (lower.endsWith('.step') || lower.endsWith('.stp') || lower.endsWith('.stl')) return '🧊';
        if (lower.endsWith('.pdf')) return '📕';
        if (lower.endsWith('.csv') || lower.endsWith('.xlsx')) return '📊';
        if (lower.endsWith('.md') || lower.endsWith('.txt')) return '📝';
        if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.svg')) return '🖼️';
        return '📄';
      };

      const rowsHtml = filesOnly.length > 0
        ? filesOnly.map(e => `
            <div class="zip-row">
              <span class="zip-row-name">${getZipEntryIcon(e.name)} ${escapeHtml(e.name)}</span>
              <span class="zip-row-size">${formatBytes(e.size)}</span>
            </div>
          `).join('')
        : `<div class="zip-row"><span class="zip-row-name">아카이브 내부 목록을 읽을 수 없습니다.</span></div>`;

      container.innerHTML = `
        <div class="zip-inspector-card">
          <div class="zip-head">
            <div>
              <div class="zip-title">📦 ${escapeHtml(file.filename)}</div>
              <div class="zip-subtitle">내부 파일 ${filesOnly.length}개 · 압축 크기 ${formatBytes(file.size_bytes)} (원본 합계 ${formatBytes(totalUncompressed)})</div>
            </div>
            <button class="btn btn-download-primary" style="padding:8px 14px;font-size:13px;" onclick="downloadCurrentFile()">📥 ZIP 패키지 다운로드</button>
          </div>
          <div class="zip-entries">${rowsHtml}</div>
        </div>
      `;
    }

    // Image Pinch/Wheel Zoom & Pan
    function updateImageTransform() {
      const img = document.getElementById('zoom-img');
      if (img) {
        img.style.transform = `translate(${imgPanX}px, ${imgPanY}px) scale(${imgScale})`;
      }
      const lbl = document.getElementById('hud-zoom-label');
      if (lbl) {
        lbl.innerText = `${Math.round(imgScale * 100)}%`;
      }
    }

    function resetImageZoom() {
      imgScale = 1.0;
      imgPanX = 0;
      imgPanY = 0;
      updateImageTransform();
    }

    function adjustImageZoom(delta) {
      imgScale = Math.max(0.5, Math.min(5.0, imgScale + delta));
      if (imgScale <= 1.05) {
        imgPanX = 0;
        imgPanY = 0;
      }
      updateImageTransform();
    }

    function bindImageZoomStage() {
      const stage = document.getElementById('zoom-stage');
      if (!stage) return;

      stage.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.25 : -0.25;
        adjustImageZoom(delta);
      }, { passive: false });

      stage.addEventListener('mousedown', (e) => {
        isDraggingImg = true;
        dragStartX = e.clientX - imgPanX;
        dragStartY = e.clientY - imgPanY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDraggingImg) return;
        imgPanX = e.clientX - dragStartX;
        imgPanY = e.clientY - dragStartY;
        updateImageTransform();
      });

      window.addEventListener('mouseup', () => {
        isDraggingImg = false;
      });

      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          pinchStartDist = Math.hypot(dx, dy);
          pinchStartScale = imgScale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTapTime < 280) {
            if (imgScale > 1.2) resetImageZoom();
            else { imgScale = 2.4; updateImageTransform(); }
            lastTapTime = 0;
            return;
          }
          lastTapTime = now;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          dragStartX = touchStartX - imgPanX;
          dragStartY = touchStartY - imgPanY;
        }
      }, { passive: true });

      stage.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          imgScale = Math.max(0.8, Math.min(5.0, pinchStartScale * (dist / pinchStartDist)));
          updateImageTransform();
        } else if (e.touches.length === 1 && imgScale > 1.05) {
          imgPanX = e.touches[0].clientX - dragStartX;
          imgPanY = e.touches[0].clientY - dragStartY;
          updateImageTransform();
        }
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        if (imgScale <= 1.05 && e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
          if (Math.abs(dx) > 65 && dy < 50) {
            stepFile(dx < 0 ? 1 : -1);
          }
        }
      }, { passive: true });
    }

    function setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea') {
          if (e.key === 'Escape') e.target.blur();
          return;
        }
        if (e.key === '/') {
          e.preventDefault();
          const s = document.getElementById('sidebar-search');
          if (s) s.focus();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault();
          stepFile(-1);
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault();
          stepFile(1);
        } else if (e.key === 'g' || e.key === 'G') {
          const gb = document.getElementById('btn-gallery');
          if (gb && gb.style.display !== 'none') toggleGalleryView();
        } else if (e.key === 'c' || e.key === 'C') {
          const tb = document.getElementById('btn-toggle-view');
          if (tb && tb.style.display !== 'none') toggleMarkdownView();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleZenMode();
        }
      });
    }

    function splitHighlightedLines(html) {
      const rawLines = html.split('\n');
      const openTags = [];
      const tagRegex = /<\/?span[^>]*>/gi;
      return rawLines.map(line => {
        const prefix = openTags.join('');
        let m;
        tagRegex.lastIndex = 0;
        while ((m = tagRegex.exec(line)) !== null) {
          const tag = m[0];
          if (tag.startsWith('</')) {
            openTags.pop();
          } else if (!tag.endsWith('/>')) {
            openTags.push(tag);
          }
        }
        const suffix = '</span>'.repeat(openTags.length);
        return prefix + line + suffix;
      });
    }

    function showCodeView() {
      document.getElementById('code-container').style.display = 'block';
      document.getElementById('markdown-container').style.display = 'none';
      const mc = document.getElementById('media-container');
      mc.style.display = 'none';
      mc.innerHTML = '';
      const toggleBtn = document.getElementById('btn-toggle-view');
      toggleBtn.innerHTML = '👁️ <span class="btn-label-desk">렌더</span> <span class="kbd">C</span>';
    }

    function showHtmlView(mediaUrl, filename) {
      document.getElementById('code-container').style.display = 'none';
      document.getElementById('markdown-container').style.display = 'none';
      const mc = document.getElementById('media-container');
      mc.style.display = 'flex';
      mc.innerHTML = `
        <iframe src="${mediaUrl}" style="width:100%;height:calc(100vh - 120px);border:none;border-radius:8px;background:#fff;" title="${escapeHtml(filename)}"></iframe>
      `;
      const toggleBtn = document.getElementById('btn-toggle-view');
      toggleBtn.innerHTML = '📝 <span class="btn-label-desk">코드</span> <span class="kbd">C</span>';
    }

    function showMarkdownView(content) {
      document.getElementById('code-container').style.display = 'none';
      const mc = document.getElementById('media-container');
      mc.style.display = 'none';
      mc.innerHTML = '';
      const mdContainer = document.getElementById('markdown-container');
      mdContainer.style.display = 'block';
      const toggleBtn = document.getElementById('btn-toggle-view');
      toggleBtn.innerHTML = '📝 <span class="btn-label-desk">코드</span> <span class="kbd">C</span>';

      if (window.marked) {
        const renderer = new marked.Renderer();
        renderer.code = function(arg1, arg2) {
          const text = (typeof arg1 === 'object' && arg1 !== null) ? arg1.text : arg1;
          const lang = (typeof arg1 === 'object' && arg1 !== null) ? arg1.lang : arg2;
          if (lang === 'mermaid' || lang === 'uml') {
            return `<div class="mermaid">${escapeHtml(text)}</div>`;
          }
          let codeHtml = '';
          try {
            if (lang && hljs.getLanguage(lang)) {
              codeHtml = hljs.highlight(text, { language: lang }).value;
            } else {
              codeHtml = hljs.highlightAuto(text).value;
            }
          } catch (_) {
            codeHtml = escapeHtml(text);
          }
          return `<pre><code class="hljs ${lang ? 'language-' + lang : ''}">${codeHtml}</code></pre>`;
        };

        mdContainer.innerHTML = marked.parse(content, { renderer, gfm: true, breaks: true });

        if (window.mermaid) {
          mermaid.run({ querySelector: '#markdown-container .mermaid' }).catch(err => {
            console.warn('Mermaid rendering warning:', err);
          });
        }
      } else {
        mdContainer.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
      }
    }

    function toggleMarkdownView() {
      const file = FILES[activeIndex];
      if (!file || (file.language !== 'markdown' && file.language !== 'html')) return;
      isMarkdownRendered = !isMarkdownRendered;
      if (isMarkdownRendered) {
        if (file.language === 'html') {
          const mediaUrl = `/review/${TOKEN}/media/${encodeURIComponent(file.filename)}`;
          showHtmlView(mediaUrl, file.filename);
        } else {
          showMarkdownView((file.content || '').replace(/\r\n/g, '\n'));
        }
      } else {
        showCodeView();
      }
    }

    function copyCurrentCode() {
      if (!FILES[activeIndex]) return;
      navigator.clipboard.writeText(FILES[activeIndex].content).then(() => {
        const btn = document.getElementById('btn-copy');
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ <span class="btn-label-desk">완료!</span>';
        btn.style.borderColor = '#22c55e';
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.style.borderColor = '';
        }, 1500);
      });
    }

    function downloadCurrentFile() {
      if (!FILES[activeIndex]) return;
      const file = FILES[activeIndex];
      const downloadUrl = `/review/${TOKEN}/download/${encodeURIComponent(file.filename)}`;
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.setAttribute('download', file.filename);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function closeViewer() {
      stopMediaPlayback();
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close) {
        window.Telegram.WebApp.close();
      } else {
        window.close();
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
