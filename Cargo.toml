[package]
name = "tuner"
version = "0.1.36"
edition = "2024"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-trait = "0.1"
futures = "0.3"
nix = { version = "0.27", features = ["fs", "process", "term", "signal"] }
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
regex = "1.10"
html-escape = "0.2"
cron = "0.12"
filetime = "0.2"
toml = "0.8"
flate2 = "1.0"
tar = "0.4"

axum = { version = "0.7", features = ["ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = { version = "0.4", features = ["util"] }
crypto_box = { version = "0.9", features = ["serde"] }
subtle = "2.5"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
mime_guess = "2.0"
rand = "0.8"
anyhow = "1.0"
url = "2.5"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
notify = "8.2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }



[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.4", features = ["util"] }


